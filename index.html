<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED VELVET RECORDS</title>
    <link rel="stylesheet" href="style.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">RED VELVET <span>RECORDS</span></div>
        <nav class="filters">
            <button id="tab-artists" class="filter-btn active">Artists</button>
            <button id="tab-catalog" class="filter-btn">Catalog</button>
        </nav>
        <div class="socials">
            <a href="https://www.instagram.com/redvelvet_records/" target="_blank">IG</a>
            <a href="https://soundcloud.com/redvelvet_records" target="_blank">SC</a>
        </div>
    </header>

    <main>
        <!-- Fundo dinâmico da imagem do artista -->
        <div id="artist-bg" class="artist-bg"></div>

        <!-- ABA 1: ARTISTAS -->
        <section id="view-artists" class="artist-container">
            <div id="artist-list" class="artist-list"></div>
        </section>

        <!-- ABA 2: CATÁLOGO -->
        <section id="view-catalog" class="catalog-container hidden">
            <div class="catalog-header">
                <h2>Complete Archive</h2>
                <p>30 home-produced tracks.</p>
            </div>
            <ul id="catalog-list" class="catalog-list">
                <!-- O JS vai cuspir as músicas aqui -->
            </ul>
        </section>
    </main>

    <!-- Player de Áudio fixo no fundo -->
    <footer class="player-bar">
        <div class="player-info">
            <h4 id="track-name">Seleciona uma faixa...</h4>
            <p id="track-artist">Red Velvet Records</p>
        </div>
        <div class="player-controls">
            <button id="play-pause" class="play-btn">►</button>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
        <div class="player-extra">
            <a href="https://www.youtube.com/channel/UCQ0CLZ12uKXZV96KbIm4UKA" target="_blank" class="btn-sub">SUBSCRIBE</a>
        </div>
    </footer>

    <!-- PLAYER EXPANSÍVEL (FULL SCREEN) -->
    <div id="full-player" class="full-player">
        <div class="full-player-header">
            <button id="close-player" class="btn-icon">▼</button>
            <span>A TOCAR AGORA</span>
            <button class="btn-icon">⋮</button>
        </div>
        
        <div class="full-player-cover">
            <div class="cover-art-text">
                RED VELVET<br><span style="color: var(--red-velvet);">RECORDS</span>
            </div>
        </div>
        
        <div class="full-player-info">
            <h2 id="full-track-name">Seleciona uma faixa...</h2>
            <p id="full-track-artist">Red Velvet Records</p>
        </div>
        
        <div class="progress-container full-progress-container">
            <div class="progress-bar full-progress-bar"></div>
        </div>
        
        <div class="full-player-controls">
            <button id="full-prev" class="btn-control">⏮&#xFE0E;</button>
            <button id="full-play-pause" class="play-btn full-play-btn">❚❚</button>
            <button id="full-next" class="btn-control">⏭&#xFE0E;</button>
        </div>
    </div>

    <script src="app.js?v=10"></script>
</body>
</html>
